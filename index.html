
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>자전거 사고 위험지역 분석기</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* 연도별 상세정보 표 추가 스타일 */
    .year-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 12px;
    }

    .year-table th,
    .year-table td {
      padding: 11px 5px;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
    }

    .year-table th {
      background: #e8eef6;
      color: #173b63;
    }

    .year-table td:first-child {
      font-weight: bold;
    }

    .year-table tfoot {
      background: #f1f5f9;
      font-weight: bold;
    }

    .year-heading {
      margin: 20px 0 8px;
      font-size: 15px;
      color: #173b63;
    }

    .year-note {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.7;
      color: #64748b;
    }

    .loading-note {
      font-size: 13px;
      color: #64748b;
    }

    #map {
      height: 540px;
    }

    @media (max-width: 760px) {
      #map {
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>자전거 사고 위험지역 분석기</h1>
    <p>공공데이터 기반 자전거 사고다발지역 지도</p>
  </header>

  <nav>
    <a href="index.html">사고 지도</a>
    <a href="about.html">프로젝트 소개</a>
    <a href="analysis.html">사고 분석</a>
  </nav>

  <main>
    <section class="card">

      <h2>자전거 사고다발지역 지도</h2>

      <p class="description">
        2021년부터 2023년까지의 자전거 사고다발지역을
        통합해서 보여줍니다.
        마커를 클릭하면 연도별 사고 현황을
        확인할 수 있습니다.
      </p>

      <div class="search-box">

        <div class="search-field">
          <label for="district">지역 선택</label>

          <select id="district">
            <option value="all">서울 전체</option>
            <option value="680">강남구</option>
            <option value="740">강동구</option>
            <option value="305">강북구</option>
            <option value="500">강서구</option>
            <option value="620">관악구</option>
            <option value="215">광진구</option>
            <option value="530">구로구</option>
            <option value="545">금천구</option>
            <option value="350">노원구</option>
            <option value="320">도봉구</option>
            <option value="230">동대문구</option>
            <option value="590">동작구</option>
            <option value="440">마포구</option>
            <option value="410">서대문구</option>
            <option value="650">서초구</option>
            <option value="200">성동구</option>
            <option value="290">성북구</option>
            <option value="710">송파구</option>
            <option value="470">양천구</option>
            <option value="560">영등포구</option>
            <option value="170">용산구</option>
            <option value="380">은평구</option>
            <option value="110">종로구</option>
            <option value="140">중구</option>
            <option value="260">중랑구</option>
          </select>
        </div>

        <button
          id="filterButton"
          class="button"
          onclick="applyFilter()">
          필터 적용
        </button>

        <button
          id="resetButton"
          class="button button-outline"
          onclick="resetFilter()">
          전체 보기
        </button>

      </div>

      <p id="currentRegion" class="description">
        현재 표시: 서울 전체 · 2021~2023년
      </p>

      <div id="mapLayout" class="map-layout">

        <aside id="detailPanel" class="detail-panel">

          <div class="panel-header">
            <h3 class="panel-title">
              사고지역 상세정보
            </h3>

            <button
              class="close-button"
              onclick="closeDetailPanel()"
              aria-label="상세정보 닫기">
              &times;
            </button>
          </div>

          <div id="detailContent"></div>
        </aside>

        <div
          id="map"
          aria-label="자전거 사고다발지역 지도">
        </div>

      </div>

      <div id="status" class="status" role="status">
        서울 전체 사고지역을 불러오고 있어요.
      </div>

      <div class="actions">
        <a href="analysis.html" class="button">
          상세 사고 분석 보기
        </a>
      </div>

    </section>
  </main>

  <footer>
    자료: 한국도로교통공단 자전거 교통사고 다발지역 OpenAPI
    <br>
    모바일프로그래밍 중간고사 프로젝트
  </footer>

  <!-- 본인의 카카오 JavaScript 키로 수정 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=aaf0869a7864218624db2f9072c41ddc"></script>

  <script src="js/map.js"></script>

</body>
</html>
