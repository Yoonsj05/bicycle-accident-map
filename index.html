
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>자전거 사고 위험지역 분석기</title>

  <!-- 외부 CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- 상단 -->
  <header>
    <h1>자전거 사고 위험지역 분석기</h1>
    <p>공공데이터 기반 자전거 교통사고 위험지역 지도</p>
  </header>

  <!-- 페이지 이동 메뉴 -->
  <nav>
    <a href="index.html">사고 지도</a>
    <a href="about.html">프로젝트 소개</a>
    <a href="analysis.html">사고 분석</a>
  </nav>

  <main>

    <!-- 지도 메인 영역 -->
    <section class="card">

      <h2>자전거 사고다발지역 지도</h2>

      <p class="description">
        서울 지역의 자전거 사고다발지역을
        지도에서 확인할 수 있어요.
        원하는 자치구를 선택하면
        해당 지역의 사고 위치를 확인할 수 있습니다.
      </p>

      <!-- 지역 필터 -->
      <div class="search-box">

        <div class="search-field">
          <label for="year">조회 연도</label>

          <select id="year">
            <option value="2023">2023년</option>
            <option value="2022">2022년</option>
            <option value="2021">2021년</option>
          </select>
        </div>

        <div class="search-field">
          <label for="district">서울 자치구</label>

          <select id="district">
            <option value="all">서울 전체</option>
            <option value="680">강남구</option>
            <option value="740">강동구</option>
            <option value="305">강북구</option>
            <option value="500">강서구</option>
            <option value="620">관악구</option>
            <option value="215">광진구</option>
            <option value="530">구로구</option>
            <option value="545">금천구</option>
            <option value="350">노원구</option>
            <option value="320">도봉구</option>
            <option value="230">동대문구</option>
            <option value="590">동작구</option>
            <option value="440">마포구</option>
            <option value="410">서대문구</option>
            <option value="650">서초구</option>
            <option value="200">성동구</option>
            <option value="290">성북구</option>
            <option value="710">송파구</option>
            <option value="470">양천구</option>
            <option value="560">영등포구</option>
            <option value="170">용산구</option>
            <option value="380">은평구</option>
            <option value="110">종로구</option>
            <option value="140">중구</option>
            <option value="260">중랑구</option>
          </select>
        </div>

        <button
          id="filterButton"
          class="button"
          onclick="applyFilter()">
          필터 적용
        </button>

        <button
          id="resetButton"
          class="button button-outline"
          onclick="resetFilter()">
          전체 보기
        </button>

      </div>

      <!-- 조회 상태 -->
      <p id="currentRegion" class="description">
        현재 표시: 2023년 서울 전체
      </p>

      <!-- 지도와 상세정보 -->
      <div id="mapLayout" class="map-layout">

        <!-- 마커 클릭 시 나타나는 정보창 -->
        <aside id="detailPanel" class="detail-panel">

          <div class="panel-header">

            <h3 class="panel-title">
              사고지역 상세정보
            </h3>

            <button
              class="close-button"
              onclick="closeDetailPanel()"
              aria-label="상세정보 닫기">
              &times;
            </button>

          </div>

          <div id="detailContent"></div>

        </aside>

        <!-- 카카오맵 -->
        <div
          id="map"
          aria-label="자전거 사고다발지역 지도">
        </div>

      </div>

      <!-- 데이터 조회 안내 -->
      <div id="status" class="status" role="status">
        서울 전체 사고 데이터를 준비하고 있어요.
      </div>

      <div class="actions">
        <a href="analysis.html" class="button">
          상세 사고 분석 보기
        </a>
      </div>

    </section>

  </main>

  <footer>
    자료: 한국도로교통공단 자전거 교통사고 다발지역 OpenAPI
    <br>
    모바일프로그래밍 중간고사 프로젝트
  </footer>

  <!-- 수정 필요: 카카오 JavaScript 키 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=aaf0869a7864218624db2f9072c41ddc"></script>

  <!-- 지도 기능 JavaScript -->
  <script src="js/map.js"></script>

</body>
</html>
